name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # Vitest runs on Node, not Bun, and Vitest 5 and Jotai 3 need Node 22.12
      # or later: pinned rather than left to whatever the runner image has.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      # The build is what ships: the desktop release copies dist/ into the
      # backend. Typechecking the source does not prove Vite can bundle it.
      - run: bun run build
